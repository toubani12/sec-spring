spring:
  application:
    name: sec-spring
  datasource:
    url: jdbc:h2:mem:security-sd
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  # cle HMAC-SHA256 encodee en Base64 (32 octets = 256 bits)
  secret: lZ+ebiWo34+BED7vEQTyFWPuVKJalLA9Lkn8jTL1Eg8=
  # duree de validite du jeton en millisecondes (1 heure)
  expiration: 3600000
